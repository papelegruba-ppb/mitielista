name: Diagnóstico de acceso a la sede ICP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostico-sede-icp
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install playwright
          fi
          python -m playwright install --with-deps chromium

      - name: Identificar entorno de ejecución
        run: |
          echo "Fecha UTC:"
          date -u
          echo "Sistema:"
          uname -a
          echo "IP pública de salida:"
          curl -sS -m 15 https://api.ipify.org || true
          echo

      - name: Comprobar acceso HTTP a la sede ICP
        continue-on-error: true
        run: |
          echo "Prueba 1: página de entrada de la sede ICP"
          curl -sS -L --max-time 20 \
            -o /dev/null \
            -w "HTTP %{http_code} | tiempo %{time_total}s | IP remota %{remote_ip}\n" \
            https://icp.administracionelectronica.gob.es/icpplus/index.html
          echo "Código de salida curl: $?"

      - name: Segunda comprobación HTTP
        continue-on-error: true
        run: |
          echo "Esperando 10 segundos antes de repetir..."
          sleep 10
          curl -sS -L --max-time 20 \
            -o /dev/null \
            -w "HTTP %{http_code} | tiempo %{time_total}s | IP remota %{remote_ip}\n" \
            https://icp.administracionelectronica.gob.es/icpplus/index.html
          echo "Código de salida curl: $?"

      - name: Ejecutar diagnóstico Playwright
        timeout-minutes: 8
        run: python -u diag.py
